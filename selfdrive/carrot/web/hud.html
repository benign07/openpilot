<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Carrot HUD</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%; background: #0a0e12; overflow: hidden;
      font-family: -apple-system, system-ui, "Noto Sans KR", sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    #wf { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 3vmin; box-sizing: border-box; }
    .top { display: flex; align-items: center; gap: 2vmin; }
    .gear {
      font-weight: 800; color: #fff; background: #16331f; border: 1px solid #2c5738;
      border-radius: 2.4vmin; padding: 0.6vmin 2.4vmin; min-width: 8vmin; text-align: center;
      font-size: clamp(18px, 7vmin, 44px); line-height: 1.1;
    }
    .spacer { flex: 1; }
    .stat { display: flex; align-items: center; gap: 1.2vmin; color: #9fb3a8; font-size: clamp(10px, 3vmin, 15px); }
    .dot { width: clamp(7px,2vmin,12px); height: clamp(7px,2vmin,12px); border-radius: 50%; background: #888; }
    .mid { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .speed { font-weight: 800; line-height: 0.85; color: #fff; font-size: clamp(60px, 42vmin, 300px); }
    .unit { color: #9fb3a8; font-size: clamp(12px, 5vmin, 30px); align-self: flex-end; padding-bottom: clamp(8px,5vmin,30px); margin-left: 1.4vmin; }
    .mode {
      display: block; width: 100%; box-sizing: border-box; border: none;
      border-radius: 3vmin; padding: clamp(10px,3.4vmin,22px);
      font-weight: 800; font-size: clamp(18px, 7vmin, 40px); color: #06130c; cursor: pointer;
      background: #cfd6d2; transition: background .15s;
    }
    .mode small { display: block; font-size: clamp(9px,2.6vmin,14px); font-weight: 600; opacity: .8; margin-bottom: .3vmin; }
    .mode:active { filter: brightness(0.9); }
    .mode.m1 { background: #38d66a; } /* eco */
    .mode.m2 { background: #ffb64d; } /* safe */
    .mode.m3 { background: #e6ebe8; } /* normal */
    .mode.m4 { background: #ff5c5c; color:#fff; } /* high */
  </style>
</head>
<body>
  <div id="wf">
    <div class="top">
      <div class="gear" id="gear">--</div>
      <div class="spacer"></div>
      <div class="stat"><span class="dot" id="dot"></span><span id="stat">연결 중…</span></div>
    </div>
    <div class="mid"><span class="speed" id="speed">--</span><span class="unit" id="unit">km/h</span></div>
    <button class="mode" id="mode" type="button" disabled><small id="modeHint">운전모드 · 변경은 정차/P에서</small><span id="modeTxt">--</span></button>
  </div>
  <script src="/js/simple_hud.js?v=20260927-3"></script>
  <script src="/js/can_diagnostics_link.js?v=20260927-3"></script>
</body>
</html>
