name: HUD source update validation
on:
  push:
    branches: [hud-device-updates-20260928]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install aiohttp cryptography
      - run: >-
          python -m unittest selfdrive.carrot.tests.test_hud_updater
          selfdrive.carrot.tests.test_live_driving_mode
          selfdrive.carrot.tests.test_driving_setting_switches
          selfdrive.carrot.tests.test_hud_settings_integrity -v
      - run: bash -n launch_chffrplus.sh
