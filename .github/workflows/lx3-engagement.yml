name: LX3 engagement candidate validation
on:
  push:
    branches: [fix/lx3-engagement-state]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-runtime-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang build-essential libcurl4-openssl-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libgbm-dev libdrm-dev qtbase5-dev libqt5charts5-dev
      - name: Install locked runtime dependencies
        run: uv sync --frozen --no-dev
      - name: Verify original driving model source
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          from pathlib import Path
          from openpilot.common.file_chunker import read_file_chunked
          path = Path('selfdrive/modeld/models/driving_supercombo.onnx')
          data = read_file_chunked(path)
          expected = path.with_name(path.name + '.sha256').read_text().strip()
          assert hashlib.sha256(data).hexdigest() == expected
          assert len(data) == 60792584
          print('Original driving ONNX verified', expected)
          PY
      - name: Build complete runtime dependency graph
        run: |
          set -o pipefail
          uv run --no-sync scons --minimal -j2 2>&1 | tee lx3-full-build.log
      - name: Import actual control processes and generated schema
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run --no-sync python - <<'PY'
          import importlib
          for name in (
            'openpilot.selfdrive.car.card',
            'openpilot.selfdrive.selfdrived.selfdrived',
            'openpilot.selfdrive.controls.controlsd',
            'openpilot.selfdrive.controls.plannerd',
            'openpilot.selfdrive.carrot.can_diagnostics.automatic_runtime',
          ):
            importlib.import_module(name)
            print('IMPORTED', name)
          from cereal import log
          msg = log.SelfdriveState.new_message(enabled=True, lx3EngagementMode=1)
          assert msg.lx3EngagementMode == 1
          PY
      - name: Relocated lateral and longitudinal MPC native runtime
        run: |
          uv run --no-sync python selfdrive/controls/tests/check_mpc_relocation.py
          uv run --no-sync python selfdrive/controls/tests/check_mpc_relocation.py --static-vendored-arch larch64
      - name: Real messaging and state-machine smoke check
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run --no-sync python -m openpilot.selfdrive.selfdrived.tests.lx3_ipc_smoke
      - name: Manual blinker handoff using actual control modules
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run --no-sync python -m unittest openpilot.selfdrive.carrot.tests.test_manual_blinker_suspend -v
      - name: Actual LX3 parameter, interface, generated DBC and controller configuration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run --no-sync python -m unittest openpilot.selfdrive.selfdrived.tests.test_lx3_runtime_configuration -v
      - name: Exact old CarState startup camera cache comparison
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run --no-sync python selfdrive/selfdrived/tests/check_lx3_camera_health_ab.py
      - name: Actual video encoder rotation and pre-fix negative A/B
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv pip install pytest
          uv run --no-sync python system/loggerd/tests/check_logger_rotation_ab.py
      - name: Actual generated Panda C++ pack and firmware decoder transport
        env:
          PYTHONPATH: ${{ github.workspace }}
          LX3_TRANSPORT_STREAM_OUT: /tmp/lx3-cpp-transport.bin
          LX3_HEARTBEAT_STREAM_OUT: /tmp/lx3-cpp-heartbeat.bin
          LX3_WRONG_EPOCH_STREAM_OUT: /tmp/lx3-cpp-wrong-epoch.bin
        run: |
          uv run --no-sync scons --minimal -j2 selfdrive/pandad/tests/test_pandad_canprotocol
          selfdrive/pandad/tests/test_pandad_canprotocol
          gcc -std=gnu11 -Wall -Wextra -Wstrict-prototypes -Werror -Wno-pointer-to-int-cast \
            -fsanitize=undefined -fno-sanitize-recover=undefined -g \
            -Iopendbc_repo/opendbc/safety/board -Iopendbc_repo/opendbc/safety \
            -Iopendbc_repo/opendbc/safety/tests/libsafety \
            opendbc_repo/opendbc/safety/tests/test_lx3_transport.c -lm -o /tmp/lx3-transport
          /tmp/lx3-transport /tmp/lx3-cpp-transport.bin
          /tmp/lx3-transport --heartbeat /tmp/lx3-cpp-heartbeat.bin
          /tmp/lx3-transport --wrong-epoch /tmp/lx3-cpp-wrong-epoch.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lx3-full-runtime-build-log
          path: |
            lx3-full-build.log
            lx3-logger-baseline-build.log
            lx3-logger-candidate-restored-build.log
            lx3-logger-rotation-ab.json
            lx3-camera-health-source-ab.json
      - name: Record scope
        if: always()
        run: echo 'This builds the complete Linux x86_64 runtime graph using the repository lockfile. --minimal excludes extra tools/tests. Import checks are not a closed-loop IPC or in-vehicle test. No OTA or installation.' >> "$GITHUB_STEP_SUMMARY"
  board-firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install board build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
          python -m pip install scons pycryptodome
      - name: Compile H7 board firmware (build validation only)
        working-directory: panda
        run: |
          mkdir -p board/obj
          scons --minimal -j2 board/obj/panda_h7.bin.signed
      - uses: actions/upload-artifact@v4
        with:
          name: lx3-h7-development-build-not-qualified-for-vehicle
          path: |
            panda/board/obj/panda_h7.bin.signed
            panda/board/obj/version
      - name: State deployment qualification
        run: echo 'Build success is not bench or vehicle qualification. No installation or OTA publication occurs in this workflow.' >> "$GITHUB_STEP_SUMMARY"
  native-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build actual Panda safety code with undefined-behavior checks
        run: >-
          gcc -std=gnu11 -Wall -Wextra -Wstrict-prototypes -Werror -Wno-pointer-to-int-cast
          -fsanitize=undefined -fno-sanitize-recover=undefined -g
          -Iopendbc_repo/opendbc/safety/board -Iopendbc_repo/opendbc/safety
          -Iopendbc_repo/opendbc/safety/tests/libsafety
          opendbc_repo/opendbc/safety/tests/test_lx3_native.c -lm -o /tmp/lx3-safety
      - name: Configuration and forwarding compatibility
        run: /tmp/lx3-safety
      - name: Classic non-CANFD protocol compatibility
        run: |
          gcc -DSTM32F4 -std=gnu11 -Wall -Wextra -Wstrict-prototypes -Werror -Wno-pointer-to-int-cast \
            -fsanitize=undefined -fno-sanitize-recover=undefined -g \
            -Iopendbc_repo/opendbc/safety/board -Iopendbc_repo/opendbc/safety \
            -Iopendbc_repo/opendbc/safety/tests/libsafety \
            opendbc_repo/opendbc/safety/tests/test_lx3_classic_protocol.c -lm -o /tmp/lx3-classic
          /tmp/lx3-classic
      - name: Actual CAN stream and native permission transport regressions
        run: |
          gcc -std=gnu11 -Wall -Wextra -Wstrict-prototypes -Werror -Wno-pointer-to-int-cast \
            -fsanitize=undefined -fno-sanitize-recover=undefined -g \
            -Iopendbc_repo/opendbc/safety/board -Iopendbc_repo/opendbc/safety \
            -Iopendbc_repo/opendbc/safety/tests/libsafety \
            opendbc_repo/opendbc/safety/tests/test_lx3_transport.c -lm -o /tmp/lx3-transport
          /tmp/lx3-transport
      - name: Compile recorded-CAN replay harness
        run: >-
          gcc -std=gnu11 -Wall -Wextra -Wstrict-prototypes -Werror -Wno-pointer-to-int-cast
          -fsanitize=undefined -fno-sanitize-recover=undefined -g
          -Iopendbc_repo/opendbc/safety/board -Iopendbc_repo/opendbc/safety
          -Iopendbc_repo/opendbc/safety/tests/libsafety
          opendbc_repo/opendbc/safety/tests/test_lx3_archive_replay.c -lm -o /tmp/lx3-archive-replay
      - name: Record legacy policy separately from guarded LX3
        shell: bash
        run: |
          set +e
          /tmp/lx3-safety --legacy-audit > native-legacy-audit.txt
          result=$?
          set -e
          test "$result" -eq 1
          grep -q 'RELEASE_AUDIT blockers=5;' native-legacy-audit.txt
      - name: Guarded LX3 software permission and forwarding audit
        id: release-audit
        shell: bash
        run: /tmp/lx3-safety --release-audit | tee native-release-audit.txt
      - name: Actual Panda C and production host delivery-order schedules
        run: |
          gcc -shared -fPIC -std=gnu11 -Wall -Wextra -Wstrict-prototypes -Werror -Wno-pointer-to-int-cast \
            -fsanitize=undefined -fno-sanitize-recover=undefined -g \
            -Iopendbc_repo/opendbc/safety/board -Iopendbc_repo/opendbc/safety \
            -Iopendbc_repo/opendbc/safety/tests/libsafety \
            opendbc_repo/opendbc/safety/tests/lx3_host_bridge.c -lm -o /tmp/lx3-host-bridge.so
          python -m selfdrive.selfdrived.tests.lx3_host_panda_joint \
            --library /tmp/lx3-host-bridge.so --report lx3-host-panda-joint.json
          python -m selfdrive.selfdrived.tests.lx3_cluster_panda_schedule \
            --library /tmp/lx3-host-bridge.so --report lx3-cluster-panda-schedule.json
      - name: Record OTA qualification separately from test infrastructure
        if: always()
        run: |
          echo '## Native release audit: ${{ steps.release-audit.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Guarded LX3 uses safetyParam bit 1024 with qualified physical 0x10B gesture processing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Passing this software audit does not qualify OTA. The passive interlock, board firmware/bench, full IPC, speed limits and OEM ownership validation remain.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The legacy policy retains its five known blockers; it is not qualified by this change.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f native-release-audit.txt ]; then
            while IFS= read -r line; do
              case "$line" in
                AUDIT*|RELEASE_AUDIT*) echo "::notice::$line" ;;
              esac
            done < native-release-audit.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-release-audit
          path: |
            native-release-audit.txt
            native-legacy-audit.txt
            lx3-host-panda-joint.json
            lx3-cluster-panda-schedule.json
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install aiohttp cryptography pycapnp
      - run: python -m unittest discover -s selfdrive/selfdrived/tests -p test_lx3_engagement.py -v
      - run: python -m unittest selfdrive.selfdrived.tests.test_lx3_inputs -v
      - run: python -m unittest selfdrive.selfdrived.tests.test_lx3_input_health -v
      - run: python -m unittest selfdrive.selfdrived.tests.test_lx3_cluster_transport -v
      - run: python -m unittest selfdrive.selfdrived.tests.test_lx3_transport -v
      - run: >-
          python -m unittest selfdrive.carrot.tests.test_hud_updater
          selfdrive.carrot.tests.test_live_driving_mode
          selfdrive.carrot.tests.test_driving_setting_switches
          selfdrive.carrot.tests.test_hud_settings_integrity
          selfdrive.carrot.tests.test_lx3_can_time
          selfdrive.carrot.can_diagnostics.test_automatic -v
      - name: Check additive telemetry schema
        run: |
          python - <<'PY'
          import capnp
          capnp.remove_import_hook()
          schema = capnp.load('cereal/log.capnp')
          for mode in (0, 1, 2):
            msg = schema.SelfdriveState.new_message(enabled=mode != 0, lx3EngagementMode=mode)
            with schema.SelfdriveState.from_bytes(msg.to_bytes()) as parsed:
              assert parsed.lx3EngagementMode == mode
              assert parsed.enabled == (mode != 0)
          PY
