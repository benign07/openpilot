name: LX3 cruise-off lateral request and stable feature regression
on:
  push:
    branches: [review/lx3-cruise-off-lateral-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest numpy pycapnp aiohttp cryptography requests scipy setproctitle
      - name: Coupled real host helpers and unmodified native C with delayed physical events
        run: |
          set -o pipefail
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/openpilot"
          export PYTHONPATH="$RUNNER_TEMP:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/opendbc_repo"
          python -m pytest --noconftest -o addopts= selfdrive/controls/tests/test_cruise_off_keep_lateral.py selfdrive/controls/tests/test_approach_comfort.py selfdrive/controls/tests/test_approach_composition.py selfdrive/controls/tests/test_flexible_gap.py selfdrive/controls/tests/test_flexible_gap_mpc.py selfdrive/controls/tests/test_speed_follow_gap.py selfdrive/controls/tests/test_manual_steering_timing.py selfdrive/controls/tests/test_surround_display.py selfdrive/controls/tests/test_lateral_margin.py selfdrive/controls/tests/test_haptic_options.py selfdrive/controls/tests/test_lx3_notification_resume.py selfdrive/controls/tests/test_notification_independence.py selfdrive/controls/tests/test_notification_border.py selfdrive/carrot/can_diagnostics/test_priority_capsule.py -q --junitxml=keep-lateral.xml 2>&1 | tee keep-lateral.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keep-lateral-${{ matrix.python }}
          path: |
            keep-lateral.xml
            keep-lateral.log
