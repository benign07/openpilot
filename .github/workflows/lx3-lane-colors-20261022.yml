name: LX3 lane colors and guide-paint shadow review
on:
  push:
    branches: [review/lx3-lane-colors-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendering-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy pillow
      - name: Rendering and guide-paint shadow contracts
        run: |
          set -o pipefail
          python -m pytest -o addopts= --confcutdir=selfdrive/controls/tests selfdrive/controls/tests/test_lane_boundary_colors.py selfdrive/controls/tests/test_guide_paint.py -q --junitxml=lane-colors.xml 2>&1 | tee lane-colors.log
          python -m py_compile selfdrive/modeld/modeld.py selfdrive/modeld/guide_paint.py tools/replay_guide_paint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-color-rendering-contract
          path: |
            lane-colors.xml
            lane-colors.log
      - name: Verification scope
        run: echo 'Drawing and synthetic guide-paint shadow contracts on Linux; no GPU/model execution, native build, device performance, semantic accuracy or road qualification. Shadow never changes model probabilities or controls.' >> "$GITHUB_STEP_SUMMARY"
